# TEMPLATE (package-modernize). Every push to master and every pull request: locked restore, format check, build with
# analyzers, tests on Ubuntu (net10.0) and Windows (net10.0 and net48, which runs the netstandard2.0 build), a pack with
# package validation on Linux, and the final `ci` job the ruleset on master requires. Publishing is release.yml.
# Replace {{PROJECT}} (the library project folder and file name) and {{TESTS}} (the test project). Actions are pinned to
# commit SHAs with the version in a comment (resolved 2026-09-25); Dependabot updates both.
name: ci

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: build and test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # Source Link records the commit
          persist-credentials: false
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: global.json
          cache: true
          cache-dependency-path: '**/packages.lock.json'
      # The lock files must not depend on anything the SDK infers per OS (reference assemblies, runtime identifiers).
      - run: dotnet restore --locked-mode
      - run: dotnet format --no-restore --verify-no-changes
      - run: dotnet build --no-restore -c Release
      # A dedicated restore that fails on any audit finding, so a future advisory blocks a merge but not a local build.
      - name: NuGet audit as errors
        run: dotnet restore -p:AuditPipeline=true --force
      - name: Test (net10.0)
        run: dotnet test --no-build -c Release -f net10.0 --logger trx --results-directory TestResults
      - name: Test (net48, Windows only; exercises the netstandard2.0 build)
        if: runner.os == 'Windows'
        run: dotnet test --no-build -c Release -f net48 --logger trx --results-directory TestResults
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: test-results-${{ matrix.os }}
          path: TestResults
          retention-days: 30
      - name: Pack with package validation against the baseline version
        if: runner.os == 'Linux'
        run: dotnet pack {{PROJECT}} --no-build -c Release -o artifacts -p:ContinuousIntegrationBuild=true
      - name: The package holds exactly what it should
        if: runner.os == 'Linux'
        run: |
          unzip -l artifacts/*.nupkg
          # TEMPLATE: assert the expected entries (lib per target, README.md, icon.png, the nuspec) and nothing else.
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: runner.os == 'Linux'
        with:
          name: package
          path: artifacts/*nupkg
          retention-days: 30

  ci:
    name: ci
    if: ${{ always() }}
    needs: [build]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Every job passed
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          echo "job results: $RESULTS"
          for result in $RESULTS; do
            if [ "$result" != success ]; then
              exit 1
            fi
          done
