# TEMPLATE (package-modernize), from CachingServiceWithAOPSupport 2.0.0 (C#, 2026-09-27; the same shape as
# IsImageUrlDotNet 2.0.0 and TrailerClipper 2.0.0, both released through it). Every push to master and every pull request:
# locked restore, dotnet format, build with warnings as errors, the NuGet audit, the tests on Linux and Windows (net10.0 on
# both; net48 on Windows, which runs the netstandard2.0 build; the golden replay in a test project of its own), a pack with
# a content and dependency check, fresh consumers of the packed package (tests/consumers/run.sh), and the final `ci` job
# the ruleset on master requires. Publishing is release.yml.
# Replace {{PACKAGE_ID}} (the nuget.org id) and {{PROJECT}} (the folder, csproj and assembly name under src/), and fill
# the two TEMPLATE blocks. An F# library: Fantomas instead of dotnet format (references/nuget.md, "F# packages").
# Actions are pinned to commit SHAs with the version in a comment (checked 2026-09-27); Dependabot updates both.
name: ci

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  # Only pull request runs are cancelled: every master commit keeps its ci result, which release.yml checks (L-120).
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

defaults:
  run:
    shell: bash

jobs:
  build:
    name: build and test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # Source Link records the commit
          persist-credentials: false
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: global.json
          cache: true
          cache-dependency-path: '**/packages.lock.json'
      # TEMPLATE: the Phase 0 commit that added the golden files (L-120 `release-checks-what-it-pushes`).
      - name: The golden recordings are unchanged since the Phase 0 commit
        run: git diff --exit-code {{PHASE0_COMMIT}} -- tests/Golden
      - run: dotnet restore --locked-mode
      - run: dotnet format --no-restore --verify-no-changes
      - run: dotnet build --no-restore -c Release
      # A dedicated restore that fails on any audit finding, so a future advisory blocks a merge but not a local build.
      - name: NuGet audit as errors
        run: dotnet restore -p:AuditPipeline=true --force
      - name: Test (net10.0)
        run: dotnet test --no-build -c Release -f net10.0 --logger trx --results-directory TestResults
      - name: Test (net48, Windows only; exercises the netstandard2.0 build)
        if: runner.os == 'Windows'
        run: dotnet test --no-build -c Release -f net48 --logger trx --results-directory TestResults
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: test-results-${{ matrix.os }}
          path: TestResults
          retention-days: 30
      - name: Pack
        run: dotnet pack src/{{PROJECT}} --no-build -c Release -o artifacts
      - name: The package holds exactly what it should and declares its dependencies
        if: runner.os == 'Linux'
        run: |
          nupkg=$(ls artifacts/{{PACKAGE_ID}}.[0-9]*.nupkg)
          # TEMPLATE: every file the package must hold, in C-locale order as `LC_ALL=C sort` gives it (uppercase first: README.md
          # sorts before an id that starts with "Ra"), adding lib/net462/... when the project targets it.
          expected=$'{{PACKAGE_ID}}.nuspec\nREADME.md\nicon.png\nlib/net10.0/{{PROJECT}}.dll\nlib/net10.0/{{PROJECT}}.xml\nlib/netstandard2.0/{{PROJECT}}.dll\nlib/netstandard2.0/{{PROJECT}}.xml'
          actual=$(unzip -Z1 "$nupkg" | grep -Ev '^(_rels/|package/|\[Content_Types\])' | LC_ALL=C sort)
          if [ "$actual" != "$expected" ]; then
            echo "::error::unexpected package contents"
            diff <(echo "$expected") <(echo "$actual")
            exit 1
          fi
          nuspec=$(unzip -p "$nupkg" {{PACKAGE_ID}}.nuspec | tr -d '\r\n')
          for tfm in .NETStandard2.0 net10.0; do
            # grep finds nothing in an empty (self-closing) group; under -e and pipefail that would end the step without a message.
            group=$(echo "$nuspec" | { grep -o "<group targetFramework=\"$tfm\">.*" || true; } | sed 's:</group>.*::')
            deps=$(echo "$group" | { grep -o '<dependency id="[^"]*" version="[^"]*"' || true; } | LC_ALL=C sort | tr '\n' ' ')
            # TEMPLATE: the declared dependencies of each group, sorted by id, each followed by one space ('' for none).
            want='<dependency id="{{DEPENDENCY_ID}}" version="{{DEPENDENCY_FLOOR}}" '
            if [ "$deps" != "$want" ]; then
              echo "::error::$tfm dependencies: $deps"
              exit 1
            fi
          done
      # Fresh consumers of the packed package (tests/consumers/run.sh and Program.cs): net10.0 everywhere, net48 on Windows,
      # in each dependency set the script lists.
      - name: Fresh consumers of the packed package
        run: |
          version=$(sed -n 's:.*<Version>\(.*\)</Version>.*:\1:p' src/{{PROJECT}}/{{PROJECT}}.csproj)
          tests/consumers/run.sh "$version" artifacts
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: runner.os == 'Linux'
        with:
          name: packages
          path: artifacts/*nupkg
          retention-days: 30

  ci:
    name: ci
    if: ${{ always() }}
    needs: [build]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Every job passed
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          echo "job results: $RESULTS"
          for result in $RESULTS; do
            if [ "$result" != success ]; then
              exit 1
            fi
          done
