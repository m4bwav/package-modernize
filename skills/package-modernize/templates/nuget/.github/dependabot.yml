# Weekly update pull requests. Merge when CI is green; read the release notes before merging a major.
# The actions are pinned to commit SHAs with the version in a comment; Dependabot updates both.
# The three-day cooldown keeps brand-new releases out until they have had time to be pulled if bad.
# TEMPLATE (package-modernize), from CachingServiceWithAOPSupport 2.0.0 (2026-09-27). A library's runtime dependencies
# are its declared floors, not versions to chase: list them under `ignore` (FSharp.Core for an F# library). An advisory on
# a floor version still shows as a Dependabot alert and fails ci.yml's audit step. Delete the ignore block if there is none.
version: 2
updates:
  - package-ecosystem: nuget
    directory: /
    schedule:
      interval: weekly
      day: monday
    cooldown:
      default-days: 3
    ignore:
      - dependency-name: {{RUNTIME_DEPENDENCY}}
    groups:
      test-packages:
        patterns:
          - "NUnit*"
          - "Microsoft.NET.Test.Sdk"
  # Updates the SDK version in global.json.
  - package-ecosystem: dotnet-sdk
    directory: /
    schedule:
      interval: weekly
      day: monday
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    cooldown:
      default-days: 3
